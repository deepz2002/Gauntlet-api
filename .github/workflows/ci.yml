name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: gauntlet
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: gauntlet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gauntlet -d gauntlet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gauntlet:local_dev_password@localhost:5432/gauntlet
      TEST_DATABASE_URL: postgresql+psycopg://gauntlet:local_dev_password@localhost:5432/gauntlet
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run unit and real PostgreSQL integration tests
        run: python -m pytest -q
      - name: Apply migrations and check model consistency
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Component and API transport tests
        run: npm test
      - name: Production build
        run: npm run build

  containers:
    name: Build both images and test Compose startup
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Validate Compose and build the production Dockerfiles
        run: |
          docker compose config --quiet
          docker compose build api frontend
      - name: Start the complete stack with an empty database volume
        run: docker compose up -d --wait --wait-timeout 120
      - name: Verify automatic migrations and a real scan through the frontend proxy
        run: python3 scripts/smoke_stack.py
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Clean up this runner's stack and volume
        if: always()
        run: docker compose down -v --remove-orphans
