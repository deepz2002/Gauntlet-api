[project]
name = "mini-gauntlet-api"
version = "0.1.0"
description = "FastAPI foundation for the Mini Gauntlet cloud posture scanner"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
