services:
  db:
    image: postgres:16.16-alpine
    container_name: gauntlet-db
    restart: unless-stopped
    environment:
      # Fictional, local development credentials only.
      POSTGRES_USER: gauntlet
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: gauntlet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gauntlet -d gauntlet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gauntlet-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://gauntlet:local_dev_password@db:5432/gauntlet
      INVENTORY_PATH: /app/data/inventory.json
      SCAN_WORKER_LIMIT: 4
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: gauntlet-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy

  adminer:
    image: adminer:5.5.1
    container_name: gauntlet-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
